<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio</title>
<link rel="stylesheet" href="Estilos.css">
</head>
<body>
  <div class="tarjeta">
    <div class="corazon">❤️</div>
    <h1>Hola persona humana con corazón,<br>escribe aquí tu nombre</h1>
    <input type="text" id="campoNombre" placeholder="Tu nombre..." autofocus>
    <div class="contenedor-boton">
      <button id="botonConfirmar">Confirmar</button>
    </div>
    <div class="aviso" id="aviso"></div>
  </div>

  <script type="module">
    
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    
    const llaves_firebase = {
      apiKey: "AIzaSyDU_bXPLmesfrA440_fco3Ca2X7foGxS-Y",
      authDomain: "hol1-cebe7.firebaseapp.com",
      projectId: "hol1-cebe7",
      storageBucket: "hol1-cebe7.firebasestorage.app",
      messagingSenderId: "1023653411089",
      appId: "1:1023653411089:web:d3da1995d97741b62b34b0"
    };

    const arranque_firebase = initializeApp(llaves_firebase);
    const base_datos = getFirestore(arranque_firebase);

    const campoNombre = document.getElementById('campoNombre');
    const boton = document.getElementById('botonConfirmar');
    const aviso = document.getElementById('aviso');

    async function confirmarNombre() {
      const nombre = campoNombre.value.trim();
      if (nombre === '') {
        aviso.textContent = 'Por favor, escribe tu nombre antes de continuar.';
        return;
      }

      localStorage.setItem('nombreGuardado', nombre);
        await addDoc(collection(base_datos, "lista_nombres"), {
        nombre_persona: nombre
      });

      window.location.href = 'Mensaje.html';
}

    boton.addEventListener('click', confirmarNombre);
    campoNombre.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') confirmarNombre();
    });
  </script>
</body>
</html>
